name: Build and publish microvpn image

# Every push and pull request runs the test suite inside the image's `test` stage (exactly what
# ./test.sh runs) and builds the `runtime` stage to prove it builds. The image is published (pushed
# to Docker Hub as `latest`, which the server's update timer deploys) only for a release tag
# `v<semver>` matching server/pyproject.toml, or when the workflow is run by hand with "publish"
# ticked, and only once the DOCKER_USERNAME / DOCKER_TOKEN secrets exist on the repository.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image as latest (deploys to raubcamaioni.com/microvpn)"
        type: boolean
        default: true

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  HAVE_HUB: ${{ secrets.DOCKER_USERNAME != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the test stage
        run: docker build --target test -t microvpn-test -f containers/Containerfile .

      - name: Run the test suite in the container
        run: docker run --rm microvpn-test pytest -v

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' server/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in server/pyproject.toml"
            exit 1
          fi

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME || 'local' }}/microvpn
          # only two tags per release (latest and the version); a manual deploy is tagged with its commit;
          # a plain build (push or pull request) gets a `build` tag that is never pushed
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=build,enable=${{ env.PUBLISH != 'true' }}

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true' && env.HAVE_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./containers/Containerfile
          target: runtime
          push: ${{ env.PUBLISH == 'true' && env.HAVE_HUB == 'true' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.revision lets the server skip a restart for an image it already runs
          labels: ${{ steps.meta.outputs.labels }}
          # plain manifests: podman on the server pulls these without attestation quirks
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
